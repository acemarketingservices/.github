name: auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-after-checks:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for every check, then squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          pr_state=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          [[ "$pr_state" == "open" ]] || { echo "Pull request is no longer open."; exit 0; }
          current_sha=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          [[ "$current_sha" == "$HEAD_SHA" ]] || { echo "A newer commit replaced this run."; exit 0; }
          sleep 30
          for attempt in {1..60}; do
            pr_state=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)
            [[ "$pr_state" == "open" ]] || { echo "Pull request is no longer open."; exit 0; }
            current_sha=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
            [[ "$current_sha" == "$HEAD_SHA" ]] || { echo "A newer commit replaced this run."; exit 0; }
            check_runs=$(gh api --paginate -H "Accept: application/vnd.github+json" "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]')
            raw_statuses=$(gh api --paginate -H "Accept: application/vnd.github+json" "repos/$REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" --jq '.[]')
            classic_statuses=$(jq -s '[reduce .[] as $s ({}; if has($s.context) then . else .[$s.context] = $s end) | .[] | select((.context | test("(^| / )(merge-after-checks|squash-merge)$") | not))]' <<<"$raw_statuses")
            check_total=$(jq -s '[.[] | select((.name | test("(^| / )(merge-after-checks|squash-merge)$") | not))] | length' <<<"$check_runs")
            check_pending=$(jq -s '[.[] | select((.name | test("(^| / )(merge-after-checks|squash-merge)$") | not) and .status != "completed")] | length' <<<"$check_runs")
            check_failed=$(jq -s '[.[] | select((.name | test("(^| / )(merge-after-checks|squash-merge)$") | not) and .status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length' <<<"$check_runs")
            status_total=$(jq 'length' <<<"$classic_statuses")
            status_pending=$(jq '[.[] | select(.state == "pending")] | length' <<<"$classic_statuses")
            status_failed=$(jq '[.[] | select(.state == "failure" or .state == "error")] | length' <<<"$classic_statuses")
            if (( check_failed > 0 )); then jq -sr '.[] | select((.name | test("(^| / )(merge-after-checks|squash-merge)$") | not) and .status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")) | "Blocked by \(.name): \(.conclusion)"' <<<"$check_runs"; exit 1; fi
            if (( status_failed > 0 )); then
              jq -r '.[] | select(.state == "failure" or .state == "error") | "Blocked by \(.context): \(.state)"' <<<"$classic_statuses"
              exit 1
            fi
            if (( check_total == 0 && status_total == 0 && attempt <= 4 )); then echo "Waiting for checks to register."; sleep 15; continue; fi
            if (( check_pending > 0 || status_pending > 0 )); then echo "Waiting for checks ($check_pending of $check_total check runs and $status_pending of $status_total statuses pending)."; sleep 15; continue; fi
            merge_state=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .mergeable_state)
            if [[ "$merge_state" == "unknown" ]]; then echo "Waiting for GitHub to calculate mergeability."; sleep 15; continue; fi
            if [[ "$merge_state" == "behind" ]]; then echo "The branch is behind $BASE_REF. Rebase it locally onto origin/$BASE_REF, then push the repaired branch."; exit 1; fi
            if [[ "$merge_state" == "dirty" ]]; then echo "The branch has a merge conflict that needs repair."; exit 1; fi
            echo "Every registered check has finished successfully."
            exit 0
          done
          echo "Checks did not finish within 15 minutes and 30 seconds."
          exit 1

  squash-merge:
    needs: merge-after-checks
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Squash merge the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          [[ "$current_sha" == "$HEAD_SHA" ]] || { echo "A newer commit replaced the verified commit."; exit 1; }
          if ! result=$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$HEAD_SHA" 2>&1); then echo "$result"; exit 1; fi
          if [[ "$(jq -r .merged <<<"$result")" != "true" ]]; then jq -r '.message // "GitHub declined the merge."' <<<"$result"; exit 1; fi
          echo "Pull request #$PR_NUMBER was squash merged."
